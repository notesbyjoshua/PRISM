   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(68.957269 278.73415)">Real-patient study</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(41.757581 289.536611)">1,845 selected GMDB patients</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(40.761956 300.339072)">3,409 FairFace reference paths</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(38.289066 311.141533)">48 × 120 = 5,760 primary tests</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(45.290081 321.943994)">Demographics; within-GMDB</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(30.276253 332.746455)">Covariates; photo/reference checks</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(236.930231 278.73415)">Separate conditional fidelity</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(227.688356 289.536611)">1,563 synthetic images pass QC</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(227.944997 300.339072)">9 matched labels; 1,424 images</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(238.899684 311.141533)">At least 10 rows per source</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(222.216637 321.943994)">Distribution and profile summaries</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(233.540466 332.746455)">Model tags; heavy-tail checks</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="205.29" y="367.36596" transform="rotate(-0 205.29 367.36596)">Synthetic rows contribute zero observations to real-patient inference.</text>
