   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(34.305469 201.452141)">QC: one unambiguous face; 120 finite outputs; yaw/pitch/roll ≤ 15°/15°/10°</text>
