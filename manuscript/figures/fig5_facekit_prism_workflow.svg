   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(110.691563 109.453631)">FaceKit (Chen et al., 2026; pinned source)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(101.941875 120.256092)">478 landmarks + facial transformation matrix</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(132.282422 131.058553)">Canonical-depth pose correction</text>
