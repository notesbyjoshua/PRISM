name: Publication readiness

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONPATH: .:FaceKit/src
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"

jobs:
  publication-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Verify historical FaceKit source snapshot
        run: sha256sum --check publication/historical_facekit/SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"

      - name: Install publication dependencies
        run: python -m pip install --upgrade pip -r publication/requirements.txt

      - name: Test current pipeline and frozen historical code
        run: python -m pytest tests -q --tb=short

      - name: Test exploratory extension contracts with synthetic data
        run: |
          python -m pytest revision_results/reviewer_followup_2026/test_extended_analysis.py -q --tb=short

      - name: Verify committed 120-feature aggregate package
        run: >-
          python publication/scripts/verify_reproducible_outputs.py
          --report "$RUNNER_TEMP/prism-120-publication-report.md"

      - name: Publish readiness summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/prism-120-publication-report.md" ]; then
            cat "$RUNNER_TEMP/prism-120-publication-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "120-feature package verification did not complete. See the failed step above." >> "$GITHUB_STEP_SUMMARY"
          fi
